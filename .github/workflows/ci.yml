name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: paper-mode
        run: |
          node --check index.js
          node --check client.js
          node --check lib/tex.js
          node --check lib/translate.js
      - name: Unit tests
        run: node --test paper-mode/test/tex.test.mjs

  mount:
    name: Browser-half mount test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-mode/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node mount.test.mjs
